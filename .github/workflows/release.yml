name: Reusable GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release. Defaults to the current tag ref.
        required: false
        type: string
        default: ""
      prerelease:
        description: Mark the release as prerelease.
        required: false
        type: boolean
        default: false
      generate-notes:
        description: Generate release notes from GitHub.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release. Defaults to the current tag ref.
        required: false
        type: string
      prerelease:
        description: Mark the release as prerelease.
        required: false
        type: boolean
        default: false
      generate-notes:
        description: Generate release notes from GitHub.
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_GENERATE_NOTES: ${{ inputs.generate-notes }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          flags=()
          if [ "$INPUT_GENERATE_NOTES" = "true" ]; then
            flags+=(--generate-notes)
          fi
          if [ "$INPUT_PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$tag" "${flags[@]}"
