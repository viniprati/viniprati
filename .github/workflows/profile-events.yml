name: Profile events

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.base.md
      - scripts/profile_events.py
      - .github/workflows/profile-events.yml

permissions:
  contents: write

jobs:
  update-profile-readme:
    name: Update profile README
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        run: python scripts/profile_events.py

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md did not change. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): update dynamic event"
          git push
